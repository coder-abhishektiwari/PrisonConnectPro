# PrisonConnect coturn configuration
# Generate your own static auth secret:
#   openssl rand -hex 32
# and replace STATIC_AUTH_SECRET below (keep it out of git; use an env file or secrets manager).

listening-port=3478
tls-listening-port=5349

realm=prisonconnect.local
server-name=prisonconnect.local

# Shared-secret HMAC authentication (used by the media clients to fetch ephemeral
# username/credential pairs via the TURN REST API).
use-auth-secret
static-auth-secret=464f02dad3072f5b202da1a8928a07cd94d0b45634e41f57db1ad47c2156d90a

# UDP/TCP relay range (matches docker-compose port mappings).
min-port=49160
max-port=49200

# No CLI/admin port over the network.
no-cli

# TLS
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

# Logging
log-file=stdout
simple-log

# Behaviour
fingerprint
no-multicast-peers
# no-tcp-relay — disabled so coturn can relay TCP for TURN entries
# requesting transport=tcp in the ICE server list.
# Local verification runs both WebRTC peers on the same host (loopback), so
# coturn must be allowed to relay packets to/from loopback peers.
allow-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Public interface to advertise for external relays — set to the server's public IP
# (same as media-server RTC_ANNOUNCED_IP). Required for TURN to work externally.
# Example: external-ip=13.234.56.78
external-ip=147.185.221.231

# Uncomment for Docker: relay on all interfaces.
relay-ip=0.0.0.0

services:
  # Production-ish PostgreSQL backing the Express API/business layer (backend).
  postgres:
    image: postgres:16-alpine
    container_name: prisonconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisonconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: prisonconnect
    ports:
      - "55432:5432"
    volumes:
      - prisonconnect-pgdata:/var/lib/postgresql/data
      - ./db-setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisonconnect -d prisonconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [prisonconnect]

  # STUN/TURN for WebRTC NAT traversal (family-web + kiosks behind NAT/firewalls).
  coturn:
    image: coturn/coturn:latest
    container_name: prisonconnect-coturn
    restart: unless-stopped
    depends_on: []
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      # coturn relays on 49160-49200 inside the container; publish on host 41000-41040
      # (kept out of Windows' excluded UDP ranges and disjoint from media's 40000-40999).
      - "41000-41040:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/certs:/etc/coturn/certs:ro
    networks: [prisonconnect]

  # Signaling server (Socket.IO + WebRTC P2P signaling) — no mediasoup, no business logic.
  signaling-server:
    build: ./signaling-server
    container_name: prisonconnect-signaling
    restart: unless-stopped
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGIN: "*"
      # Grace period before a room is torn down after its last socket drops
      # unexpectedly (client auto-reconnects within this window).
      DISCONNECT_GRACE_MS: ${DISCONNECT_GRACE_MS:-15000}
    ports:
      - "3002:3002"
    networks: [prisonconnect]

  # API / business layer.
  # Host port 59354 matches the Android kiosk's default API_BASE_URL.
  # SIGNALING_PUBLIC_URL is handed to clients (kiosk/family-web) inside the
  # create-call response so the Android app never needs a rebuild when the
  # public signaling URL changes.
  backend:
    build: ./backend
    container_name: prisonconnect-backend
    restart: unless-stopped
    environment:
      # Dev deployment behind tunnels: keep NODE_ENV off "production" so the
      # family-link validator accepts the http://<public-ip>:5173 call links.
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://prisonconnect:${POSTGRES_PASSWORD}@postgres:5432/prisonconnect
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SIGNALING_URL: http://signaling-server:3002
      SIGNALING_PUBLIC_URL: ${SIGNALING_PUBLIC_URL:-}
      FAMILY_WEB_URL: ${FAMILY_WEB_URL:-http://127.0.0.1:5173}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-2}
    ports:
      - "59354:3001"
    depends_on:
      postgres:
        condition: service_healthy
      signaling-server:
        condition: service_started
    networks: [prisonconnect]

  # Family web portal (Vite build served by Nginx).
  family-web:
    build:
      context: ./family-web
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://127.0.0.1:3001}
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://127.0.0.1:3002}
        VITE_WEBRTC_ICE_SERVERS: ${VITE_WEBRTC_ICE_SERVERS:-[{"urls":"turn:127.0.0.1:3478"}]}
    container_name: prisonconnect-family-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - signaling-server
    networks: [prisonconnect]

  # Warden & SaaS admin monitoring dashboard.
  warden-dashboard:
    build:
      context: ./warden-dashboard
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://127.0.0.1:3001}
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://127.0.0.1:3002}
    container_name: prisonconnect-warden-dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
      - signaling-server
    networks: [prisonconnect]

  # Vendor dashboard.
  vendor-dashboard:
    build:
      context: ./vendor-dashboard
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://127.0.0.1:3001}
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://127.0.0.1:3002}
        VITE_DEFAULT_USERNAME: ${VITE_DEFAULT_USERNAME:-admin}
        VITE_DEFAULT_PASSWORD: ${VITE_DEFAULT_PASSWORD:-admin}
    container_name: prisonconnect-vendor-dashboard
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
      - signaling-server
    networks: [prisonconnect]

volumes:
  prisonconnect-pgdata:

networks:
  prisonconnect:
    driver: bridge